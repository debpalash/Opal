name: Android APK

# Sideload APK of the Android build (scripts/android-build.py --apk).
#   • release.yml calls this after publishing a tag → the APK is attached to the
#     release and added to SHA256SUMS.txt. A failed Android build never blocks
#     the desktop release.
#   • workflow_dispatch re-attaches the APK to an existing release tag.
#   • pull requests touching the Android build only build it (no upload).
# Without OPAL_ANDROID_KEYSTORE secrets the APK is debug-signed.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the APK to (for example v0.9.4)"
        required: true
        type: string
  pull_request:
    paths:
      - "mobile/android/**"
      - "build-android.zig"
      - "src/android.zig"
      - "src/mobile/**"
      - "scripts/android-*.py"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OPAL_RELEASE_TAG: ${{ inputs.tag }}
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The default 'tools' package no longer exists; install what we need below.
          packages: ''
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager "platform-tools" "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.1
      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build nasm autoconf automake libtool pkg-config gperf wget unzip
          # mpv-android's fontconfig needs meson >= 1.11; apt's is 1.3.2.
          python3 -m venv "$HOME/meson-venv" && "$HOME/meson-venv/bin/pip" install 'meson>=1.11'
          echo "$HOME/meson-venv/bin" >> "$GITHUB_PATH"
      # mpv-android downloads its own SDK/NDK (~GBs); key on its pin only so
      # android-deps.py edits do not re-download it.
      - name: mpv-android pin
        id: mpvpin
        run: |
          pin=$(python3 -c "import json;print([s['version'] for s in json.load(open('mobile/android/dependencies.json'))['sources'] if s['name']=='mpv-android'][0])")
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .zig-cache/android-native/sources/mpv-android/*/buildscripts/sdk
          key: android-mpv-sdk-${{ steps.mpvpin.outputs.pin }}
      - uses: actions/cache@v4
        with:
          path: .zig-cache/android-native
          key: android-native-${{ hashFiles('mobile/android/dependencies.json', 'scripts/android-deps.py') }}
      - name: Release signing key
        # Stable key so updates install over older APKs; without the secrets the
        # APK is debug-signed (uninstall before upgrading).
        env:
          KS_B64: ${{ secrets.OPAL_ANDROID_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.OPAL_ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.OPAL_ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "No signing secrets: debug-signed APK"; exit 0; fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/opal-release.jks"
          {
            echo "OPAL_ANDROID_KEYSTORE=$RUNNER_TEMP/opal-release.jks"
            echo "OPAL_ANDROID_KEYSTORE_PASSWORD=$KS_PASSWORD"
            echo "OPAL_ANDROID_KEY_ALIAS=${KS_ALIAS:-opal}"
          } >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          VERSION=$(python3 -c 'import re; print(re.search(r"\.version\s*=\s*\"([^\"]+)\"", open("build.zig.zon").read())[1])')
          if [ -n "$OPAL_RELEASE_TAG" ]; then python3 scripts/check-release-version.py "$OPAL_RELEASE_TAG"; fi
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${NDK_VERSION}"
          python3 -u scripts/android-build.py --apk "dist/Opal-${VERSION}-android.apk"
          cd dist && sha256sum Opal-*-android.apk
      - name: Pack native prefix
        run: tar -C .zig-cache/android-native -czf android-native-prefix.tar.gz prefix
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/Opal-*-android.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-prefix
          path: android-native-prefix.tar.gz
          if-no-files-found: error
      - name: Attach to the release and its checksum manifest
        if: env.OPAL_RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$OPAL_RELEASE_TAG" dist/Opal-*-android.apk --clobber
          gh release download "$OPAL_RELEASE_TAG" -p SHA256SUMS.txt -D published
          grep -v -- '-android\.apk' published/SHA256SUMS.txt > SHA256SUMS.txt || true
          (cd dist && sha256sum Opal-*-android.apk) >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$OPAL_RELEASE_TAG" SHA256SUMS.txt --clobber
