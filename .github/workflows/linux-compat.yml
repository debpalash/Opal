name: Ubuntu 20.04 compatibility
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      TMDB_API_TOKEN:
        required: false
      OMDB_API_KEY:
        required: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Export the native dependency cache before app/package validation. A
      # regression in the app must not force another complete media build.
      - name: Build pinned runtime on Ubuntu 20.04
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/linux-compat/Dockerfile
          target: runtime-deps
          platforms: linux/amd64
          cache-from: type=gha,scope=linux-compat
          cache-to: type=gha,mode=max,scope=linux-compat
      - name: Build and stage compatibility app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/linux-compat/Dockerfile
          target: artifacts
          platforms: linux/amd64
          outputs: type=local,dest=compat-artifacts
          build-args: OPAL_BUILD_CACHE_KEY=${{ inputs.release && github.run_id || 'preview' }}
          cache-from: type=gha,scope=linux-compat
          cache-to: type=gha,mode=max,scope=linux-compat
          secrets: |
            opal_tmdb=${{ secrets.TMDB_API_TOKEN }}
            opal_omdb=${{ secrets.OMDB_API_KEY }}
      - name: Package compatibility deb and corresponding sources
        run: |
          export VERSION=$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          curl -fL --retry 3 https://github.com/goreleaser/nfpm/releases/download/v2.41.3/nfpm_2.41.3_Linux_x86_64.tar.gz -o /tmp/opal-nfpm.tar.gz
          tar -xzf /tmp/opal-nfpm.tar.gz nfpm
          ./nfpm package -f packaging/linux-compat/nfpm.yaml -p deb -t "opal_${VERSION}_compat_amd64.deb"
          mkdir -p compat-artifacts/sources/opal
          git archive HEAD | tar -x -C compat-artifacts/sources/opal
          tar -C compat-artifacts/sources -czf "opal-${VERSION}-linux-compat-sources.tar.gz" .
      - name: Verify ISA baseline of compatibility app
        run: python3 scripts/check-isa-baseline.py compat-artifacts/compat-root/usr/lib/opal/opal-bin
      - name: Install and launch on clean Ubuntu 20.04
        run: |
          docker build -f packaging/linux-compat/smoke.Dockerfile -t opal-compat-smoke .
          docker run --rm -e VERSION="$VERSION" opal-compat-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: linux-compat
          path: |
            opal_*_compat_amd64.deb
            opal-*-linux-compat-sources.tar.gz
          if-no-files-found: error
