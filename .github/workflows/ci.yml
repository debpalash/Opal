name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure-Zig unit tests — no native deps needed (build.zig's test step compiles
  # only the *_pure.zig modules), so this runs fast on every platform.
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        experimental: [false]
        include:
          # Windows is tolerated-failing (experimental → continue-on-error):
          # the *_pure.zig modules have no native deps and should compile with
          # a stock Windows zig — no MSYS2 needed — but that's unproven on
          # real runners. Move windows-2022 into the main `os` axis once a few
          # runs come back green.
          - os: windows-2022
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: zig build test
        run: zig build test

  # Full app build on macOS arm64 — the primary supported platform.
  # build.zig links against /opt/homebrew, which matches arm64 runners.
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install native dependencies
        run: |
          brew update
          brew install mpv sqlite onnxruntime sdl2 libtorrent-rasterbar
      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe
      - name: Binary exists
        run: test -x zig-out/bin/opal

  # Feature suite — source-level checks (DB schema, config, thread-safety
  # sweeps, script compilation) plus a full zig build, so it needs the same
  # native deps as build-macos. Optional components report as "skip".
  feature-suite:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install native dependencies
        run: |
          brew update
          brew install mpv sqlite onnxruntime sdl2 libtorrent-rasterbar
      - name: Run tests/test_features.py
        run: python3 tests/test_features.py

  # Headless Docker image: the ONLY reliable gate for the hosted deployment
  # (macOS dev hosts cannot validate a Linux image). Builds the image, boots
  # it, and smoke-tests the unauthenticated surface: /health liveness and the
  # account flow — first-run register returns a session token that authorizes
  # the API, and no token is 401.
  # Windows runtime smoke — build the HEADLESS server on Windows and actually
  # run it. This job exists because of a specific bug class: POSIX-only shell
  # idioms that fail SILENTLY on Windows. `curl -o /dev/null` (no such path on
  # Windows) made the embedded Suwayomi health probe report failure for a
  # healthy server, and `pkill` (nonexistent) made every sidecar cleanup a
  # no-op. Neither showed up in a build — only in running the thing.
  #
  # Headless, not the GUI build: it needs no window/session, and it exposes
  # /health, so the runner can assert the server is genuinely serving rather
  # than merely "still alive after 10 seconds" (which a hung process passes).
  #
  # Experimental for now, like unit-tests(windows) — promote once a few runs
  # come back green.
  smoke-windows:
    runs-on: windows-2022
    # STILL advisory. The job has failed on every run since it was added
    # (opal.exe exits before serving) and the step captured no output, so the
    # cause is unknown. It stays non-blocking until it goes green at least
    # once; promoting a permanently-red job would just teach everyone to
    # ignore CI. The `diagnose` dump below is what will identify the cause.
    continue-on-error: true
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Force LF checkout
        # build.zig's torrent-wrapper step runs through MSYS2 `sh`; CRLF would
        # break it. Must run before checkout, and before MSYS2 exists.
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          # MINGW64, not UCRT64 — see release.yml for the CRT-mismatch story.
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-mpv
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-libtorrent-rasterbar
            mingw-w64-x86_64-pkgconf
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build headless (ReleaseSafe)
        run: zig build -Dheadless=true -Doptimize=ReleaseSafe
      - name: Boot + smoke
        run: |
          # -x stays on permanently. This job spent six runs failing with
          # "exit 127" and no output; the trace is what makes it diagnosable,
          # and smoke-job noise is a fine price for that.
          set -eux
          # Resources must sit beside the exe: detectResourceRoot probes for
          # engines/nova2.py, and without it torrent search silently returns
          # nothing (the issue #21 packaging bug).
          cp -r engines web zig-out/bin/ 2>/dev/null || true
          cp data/plugins-manifest.json zig-out/bin/ 2>/dev/null || true
          # The C++ torrent wrapper is built by a sh step in build.zig and lands
          # in the REPO ROOT, not in zig-out/bin. The exe links it by name, so
          # launching from zig-out/bin without it dies instantly with
          # "torrent_wrapper.dll: cannot open shared object file" — which is
          # exactly what this job had been failing on since it was added, with
          # no output to say so. The release job stages it the same way.
          cp torrent_wrapper.dll zig-out/bin/ 2>/dev/null || cp libtorrent_wrapper.dll zig-out/bin/ 2>/dev/null || true
          cd zig-out/bin
          # Capture the app's own output. Without this the job could only ever
          # report "exited before serving" with no reason attached — a red gate
          # that tells you nothing is barely better than no gate, and this one
          # has failed on every run since it was added.
          ./opal.exe > opal.log 2>&1 &
          OPAL_PID=$!
          diagnose() {
            echo "--- opal.log ---"
            cat opal.log 2>/dev/null || echo "(no output captured)"
            echo "--- unresolved DLL imports ---"
            ldd ./opal.exe 2>/dev/null | grep -i "not found" || echo "(none)"
            echo "--- files beside the exe ---"
            ls -la
          }
          ok=0
          for i in $(seq 1 40); do
            if curl -fs http://127.0.0.1:41595/health >/dev/null 2>&1; then ok=1; break; fi
            # Fail fast if the process died rather than waiting out the loop.
            kill -0 "$OPAL_PID" 2>/dev/null || { echo "::error::opal.exe exited before serving"; diagnose; exit 1; }
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "::error::/health never came up"; diagnose; exit 1; }
          curl -fs http://127.0.0.1:41595/health | grep -q '"ok":true'
          curl -fs http://127.0.0.1:41595/ | grep -qiE 'opal|<!doctype'
          # Unauthenticated API must 401 — same contract as the container.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:41595/api/status)" = 401 ]
          # The two Windows-only regressions this job exists to catch:
          #  1. `curl -o NUL -w %{http_code}` is the health-probe idiom the app
          #     uses internally (io_global.devNull). Prove it works HERE.
          code=$(curl -sL -o NUL -w '%{http_code}' --max-time 10 http://127.0.0.1:41595/health)
          [ "$code" = 200 ] || { echo "::error::curl -o NUL probe returned $code, not 200"; exit 1; }
          #  2. killByCommandLine's Windows path is asserted in a NATIVE pwsh
          #     step below. Driving powershell through MSYS2 bash mangles the
          #     argument string: powershell.exe resolved and ran for 5s, then
          #     the step exited 127. Not worth fighting the translation layer
          #     for an assertion that is trivially native.
          echo "windows smoke passed: serves /health, 401s unauthed, NUL probe works"

      - name: CIM kill (killByCommandLine parity)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Exactly what io_global.killByCommandLine runs on Windows.
          Get-CimInstance Win32_Process |
            Where-Object { $_.CommandLine -like "*opal.exe*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 3
          try {
            Invoke-WebRequest -Uri "http://127.0.0.1:41595/health" -TimeoutSec 5 -UseBasicParsing | Out-Null
            Write-Error "CIM kill did not stop opal.exe - killByCommandLine is a no-op on Windows"
            exit 1
          } catch [System.Net.WebException], [Microsoft.PowerShell.Commands.HttpResponseException] {
            Write-Host "CIM kill works: /health is gone"
          } catch {
            Write-Host "CIM kill works: /health unreachable ($($_.Exception.GetType().Name))"
          }

  docker-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t opal:headless .
      - name: Boot + smoke
        run: |
          docker run -d --name opal -p 41595:41595 opal:headless
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:41595/health && break
            sleep 2
          done
          curl -fs http://127.0.0.1:41595/health | grep -q '"ok":true'
          curl -fs http://127.0.0.1:41595/ | grep -qiE 'opal|<!doctype'
          curl -fs http://127.0.0.1:41595/api/auth/status | grep -q '"needs_setup":true'
          TOKEN=$(curl -fs -X POST --data 'username=ci-admin&password=ci-smoke-pass' http://127.0.0.1:41595/api/auth/register | sed 's/.*"token":"//;s/".*//')
          [ "${#TOKEN}" -ge 32 ]
          curl -fs -H "Authorization: Bearer $TOKEN" -o /dev/null http://127.0.0.1:41595/api/status
          # no token must 401
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:41595/api/status)" = 401 ]
      - name: Logs on failure
        if: failure()
        run: docker logs opal || true
