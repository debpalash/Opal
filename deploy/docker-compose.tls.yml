# Opal headless server behind Caddy — automatic HTTPS (Let's Encrypt).
#
# First complete the local first-admin bootstrap with docker-compose.yml; both
# profiles use the same ../data/config mount. Then, with DNS for your domain
# pointed at this host and ports 80 + 443 reachable from the internet:
#
#   DOMAIN=opal.example.com docker compose -f deploy/docker-compose.tls.yml up --build -d
#
# Then sign in at https://opal.example.com. Opal never binds a public port —
# Caddy terminates TLS; Opal shares its network namespace and binds loopback.
# Never send the setup credential through the proxy.
services:
  opal:
    build:
      context: ..
      dockerfile: Dockerfile
    image: opal:headless
    restart: unless-stopped
    environment:
      OPAL_HEADLESS: "1"
      OPAL_HTTPS_PROXY: "1"
      OPAL_DOWNLOAD_DIR: "/media"
    network_mode: service:caddy
    depends_on:
      - caddy
    # Same prepared host directories as docker-compose.yml (create_host_path:
    # false: a missing directory fails startup instead of being root-created).
    volumes:
      - type: bind
        source: ../data/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ../data/cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ../data/media
        target: /media
        bind:
          create_host_path: false

  caddy:
    # Reviewed multi-arch index digest (2026-11-23); bump deliberately.
    image: caddy:2@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN=your.hostname (DNS must point here)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
