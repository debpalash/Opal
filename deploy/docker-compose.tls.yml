# Opal headless server behind Caddy — automatic HTTPS (Let's Encrypt).
#
# First complete the local first-admin bootstrap with docker-compose.yml; both
# profiles use the same ../data/config mount. Then, with DNS for your domain
# pointed at this host and ports 80 + 443 reachable from the internet:
#
#   DOMAIN=opal.example.com docker compose -f deploy/docker-compose.tls.yml up --build -d
#
# Then sign in at https://opal.example.com. Opal never binds a public port —
# Caddy terminates TLS; Opal shares its network namespace and binds loopback.
# Never send the setup credential through the proxy.
services:
  opal:
    build:
      context: ..
      dockerfile: Dockerfile
    image: opal:headless
    restart: unless-stopped
    environment:
      OPAL_HEADLESS: "1"
      OPAL_HTTPS_PROXY: "1"
    network_mode: service:caddy
    depends_on:
      - caddy
    volumes:
      # Runtime data at the repo root (see .gitignore); move to named volumes
      # or host paths for a real deployment.
      - ../data/config:/config
      - ../data/cache:/cache
      - ../data/media:/media

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN=your.hostname (DNS must point here)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
