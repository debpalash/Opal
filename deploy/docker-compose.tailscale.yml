# Opal headless server on your tailnet via a Tailscale sidecar.
#
# No public ports, no domain, no manual certs: Tailscale gives the node a
# stable `*.ts.net` name and a real HTTPS cert, and `tailscale serve` proxies
# it to Opal. Only devices on your tailnet can reach it (use Tailscale Funnel
# if you want it public).
#
# 1. Complete the local first-admin bootstrap with docker-compose.yml; both
#    profiles use the same ../data/config mount.
# 2. Get a reusable auth key: https://login.tailscale.com/admin/settings/keys
# 3. From the repo root:
#      TS_AUTHKEY=tskey-auth-xxxx docker compose -f deploy/docker-compose.tailscale.yml up --build -d
# 4. Open https://opal.<your-tailnet>.ts.net and sign in. Never send the setup
#    credential through the Tailscale proxy.
#
# Opal shares the sidecar's network namespace, so `tailscale serve` reaches it
# at 127.0.0.1:41595. Opal binds no host port of its own.
services:
  tailscale:
    # Reviewed multi-arch index digest of :stable (2026-11-23); never :latest.
    image: tailscale/tailscale:stable@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    hostname: opal # → https://opal.<tailnet>.ts.net
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?get a reusable key from the Tailscale admin console}
      # State is persisted below; do not re-authenticate on every restart.
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # The TUN device and NET_ADMIN below are for kernel networking. Without
      # this setting the image defaults to slower userspace networking.
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --accept-dns=false
    volumes:
      - ../data/tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun
    cap_add:
      - net_admin

  opal:
    build:
      context: ..
      dockerfile: Dockerfile
    image: opal:headless
    restart: unless-stopped
    environment:
      OPAL_HEADLESS: "1"
      OPAL_HTTPS_PROXY: "1"
      OPAL_DOWNLOAD_DIR: "/media"
    # Share the tailscale netns so `tailscale serve` proxies to localhost:41595.
    network_mode: service:tailscale
    # Same prepared host directories as docker-compose.yml (create_host_path:
    # false: a missing directory fails startup instead of being root-created).
    volumes:
      - type: bind
        source: ../data/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ../data/cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ../data/media
        target: /media
        bind:
          create_host_path: false
    depends_on:
      - tailscale
