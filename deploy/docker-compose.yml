# Opal — headless server
#
# NOT verifiable on macOS dev. Run on a real Linux/Docker host, from repo root:
#   install -d data/config data/cache data/media
#   sudo chown -R 10001:10001 data/config data/cache data/media
#   docker compose -f deploy/docker-compose.yml up --build -d
#
# First-admin creation is deliberately a local-operator action. Read the
# owner-only data/config/opal/setup.token file and paste it into the local web
# setup form, or send it in the X-Opal-Setup-Token registration header. The
# one-time file is deleted after successful registration; logs print its path,
# never its value.
services:
  opal:
    build:
      context: ..
      dockerfile: Dockerfile
    image: opal:headless
    restart: unless-stopped
    environment:
      # Explicit container binding; host publication stays loopback.
      OPAL_HEADLESS: "1"
      OPAL_WEB_BIND: "lan"
      # Downloads, /stream and the default library live on the /media mount.
      OPAL_DOWNLOAD_DIR: "/media"
    ports:
      # Host-loopback by default. Put Caddy/Tailscale in front for remote use.
      - "127.0.0.1:41595:41595" # web UI + JSON API (single port)
    # Paths are relative to this file; ../ keeps runtime data at the repo root.
    # Long syntax with create_host_path: false — a missing host directory is a
    # startup error, not a silently created root-owned directory that the
    # image's uid 10001 cannot write (the first-boot failure mode of the short
    # `../data/config:/config` form). Prepare them with the install/chown above.
    volumes:
      # config.json, opal.db, api.token and the one-time setup.token land
      # under /config/opal/ (XDG_CONFIG_HOME=/config); setup.token is 0600.
      - type: bind
        source: ../data/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ../data/cache
        target: /cache
        bind:
          create_host_path: false
      # Downloads + library. Extra read-only libraries can be mounted beneath
      # it, e.g. `- /srv/films:/media/films:ro`.
      - type: bind
        source: ../data/media
        target: /media
        bind:
          create_host_path: false
