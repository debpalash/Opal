name: Opal
include:
  - native-libraries.yml
options:
  bundleIdPrefix: com.debpalash
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: iphoneos
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    ENABLE_DEBUG_DYLIB: NO
    DEBUG_INFORMATION_FORMAT: dwarf
    CLANG_ENABLE_OBJC_ARC: YES
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../../zig-out/ios/include"
    LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../zig-out/ios/lib"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Opal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - main.c
      - bridge.m
      - native_browser.m
      - http.m
      - path: ../../zig-out/ios-assets/Assets.xcassets
      - path: ../../zig-out/ios-assets/OpalPreview.mp4
        buildPhase: resources
      - path: ../../zig-out/ios-assets/OpalBrand.png
        buildPhase: resources
      - path: ../../zig-out/ios-assets/cacert.pem
        buildPhase: resources
      - path: ../../zig-out/ios-assets/plugins-manifest.json
        buildPhase: resources
    info:
      path: ../../zig-out/ios-assets/Info.plist
      properties:
        CFBundleDisplayName: Opal
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debpalash.opal.ios
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - framework: ../../zig-out/ios/lib/libopal_ios.a
        embed: false
      - framework: ../../zig-out/ios/lib/libSDL3.a
        embed: false
      - sdk: UIKit.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: VideoToolbox.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreText.framework
      - sdk: CoreImage.framework
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
      - sdk: libexpat.tbd
      - sdk: libresolv.tbd
      - sdk: libxml2.tbd
      - sdk: libz.tbd
      - sdk: libc++.tbd
      - sdk: UniformTypeIdentifiers.framework
      - sdk: WebKit.framework
      - sdk: ImageIO.framework
      - sdk: libsqlite3.tbd
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: Foundation.framework
      - sdk: CoreMotion.framework
      - sdk: GameController.framework
      - sdk: OpenGLES.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
